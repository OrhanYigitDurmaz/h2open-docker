name: Build Bundle
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
env:
  FRAPPE_REF: version-16
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: bundle-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: frappe/frappe_docker
          ref: main
          path: builder
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Stage apps.json into build context
        run: cp apps.json builder/apps.json
      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/heads/}"
          TAG="${TAG#v}"
          echo "tag=${TAG:-latest}" >> $GITHUB_OUTPUT
          echo "sha_tag=${{ env.FRAPPE_REF }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: builder
          file: builder/images/layered/Containerfile
          build-args: |
            FRAPPE_IMAGE_PREFIX=frappe
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
          platforms: linux/amd64
          push: true
          secrets: |
            id=apps_json,src=builder/apps.json
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/h2open-docker:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/h2open-docker:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=bundle-${{ env.FRAPPE_REF }}
          cache-to: type=gha,mode=max,scope=bundle-${{ env.FRAPPE_REF }}
